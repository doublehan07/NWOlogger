[project]
name = "qhlogger"
version = "0.1.0"
description = "A minimal, cross-platform amateur radio logger"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Han Zhang" }]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "httpx>=0.27",
    "keyring>=25",
]

[project.scripts]
qhlogger = "qhlogger.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qhlogger"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
